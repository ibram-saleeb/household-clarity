name: Build Android App Bundle (.aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap CLI Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Production Web Assets
        run: npm run build

      - name: Compile Android App Bundle (.aab)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: nusyhsRDPmAe
          BUBBLEWRAP_KEY_PASSWORD: nusyhsRDPmAe
        run: |
          echo "yes" | bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Upload Android App Bundle Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: project-tandem-release-aab
          path: |
            *.aab
            *.apk
          retention-days: 30
