name: Build Android App Bundle (.aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap CLI Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Native Project via Bubblewrap
        run: |
          bubblewrap init --manifest=https://project-tandem.pages.dev/manifest.json --directory=./android-project

      - name: Configure Signing Credentials
        run: |
          cp android-release-key.keystore android-project/
          cat <<EOF > android-project/twa-manifest.json
          {
            "packageId": "app.pages.project_tandem.twa",
            "name": "Project Tandem — Household Financial Clarity",
            "launcherName": "Tandem",
            "display": "standalone",
            "themeColor": "#0B0F19",
            "themeColorDark": "#0B0F19",
            "navigationColor": "#0B0F19",
            "navigationColorDark": "#0B0F19",
            "backgroundColor": "#0B0F19",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://project-tandem.pages.dev/icons/icon-512x512.png",
            "maskableIconUrl": "https://project-tandem.pages.dev/icons/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android-release-key.keystore",
              "alias": "my-key-alias"
            },
            "appVersionName": "1.1.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://project-tandem.pages.dev/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": { "enabled": false },
              "playBilling": { "enabled": false }
            },
            "alphaDependencies": { "enabled": false }
          }
          EOF

      - name: Build Signed App Bundle via Gradle
        working-directory: ./android-project
        env:
          KEYSTORE_PASSWORD: nusyhsRDPmAe
          KEY_PASSWORD: nusyhsRDPmAe
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=./android-release-key.keystore \
            -Pandroid.injected.signing.store.password=nusyhsRDPmAe \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=nusyhsRDPmAe || ./gradlew bundleRelease

      - name: Copy & Prepare Output Bundle
        run: |
          find android-project -name "*.aab" -exec cp {} ./Tandem.aab \;
          find android-project -name "*.apk" -exec cp {} ./Tandem.apk \;
          ls -la Tandem.aab || echo "Checking bundle location"

      - name: Upload Android App Bundle Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Tandem-Google-Play-Bundle
          path: |
            Tandem.aab
            Tandem.apk
            android-project/app/build/outputs/bundle/release/*.aab
          retention-days: 30
