name: Build Android App Bundle (.aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Web Production Assets
        run: npm run build

      - name: Generate Android Signing Keystore if needed
        run: |
          if [ ! -f "android-release-key.keystore" ]; then
            keytool -genkey -v \
              -keystore android-release-key.keystore \
              -alias tandem-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tandemPassword123! \
              -keypass tandemPassword123! \
              -dname "CN=Project Tandem, OU=Engineering, O=Project Tandem, L=Sydney, ST=NSW, C=AU"
          fi

      - name: Initialize & Build Android TWA Bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: tandemPassword123!
          BUBBLEWRAP_KEY_PASSWORD: tandemPassword123!
        run: |
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Upload Android App Bundle Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: project-tandem-release-aab
          path: |
            *.aab
            *.apk
          retention-days: 30
