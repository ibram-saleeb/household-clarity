name: Tandem CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_google_play:
        description: 'Publish .aab to Google Play Internal Testing?'
        required: true
        type: boolean
        default: false
      track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Production Web Build
        run: npm run build

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (Instant OTA)
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web Bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=project-tandem --branch=main
        continue-on-error: true

  build-android:
    name: Build Signed Android App Bundle (.aab)
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_google_play == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Decode Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android-release-key.keystore
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tandem-Android-Release
          path: |
            *.aab
            *.apk
          retention-days: 30

  publish-google-play:
    name: Publish to Google Play Store
    needs: build-android
    if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_google_play == 'true') && env.HAS_GOOGLE_PLAY_KEY == 'true'
    env:
      HAS_GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY_JSON != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Tandem-Android-Release

      - name: Publish to Google Play
        uses: rigney/google-play-action@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
          packageName: app.pages.project_tandem.twa
          releaseFiles: Tandem.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
